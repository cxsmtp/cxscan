# cxscan — minimal LOCAL config for a credential-free smoke test.
# Only the OSS engines (KICS + 2ms) are enabled, so you can run the whole flow
# end-to-end without a CxSAST/CxOne tenant or git credentials (public repo).
#
# Start with:  uvicorn app.app:app --reload --port 8080   (or ./run.sh)
# then point the Scan tab at a public repo, or override git_url in the form.

input:
  git_url: "https://github.com/cxsmtp/cxscan.git"
  git_ref: "main"
  clone_depth: 1                # shallow is fine for KICS; turn off for 2ms history

engines:
  sast:
    enabled: false             # needs a CxSAST tenant — off for the local smoke test
  sca:
    enabled: false             # needs a CxOne tenant — off for the local smoke test
  kics:
    enabled: true
    reports: [json, sarif]     # sarif feeds the dashboard
    exclude_severities: [info, trace]
    threshold:
      High: 0
      Medium: 25
  twoms:
    enabled: true
    scan_git_history: false
    reports: [json, sarif]
    threshold:
      High: 0

output:
  results_dir: "./runs"
  redact_secret_values: true
